name: Compilar APK Copa CD

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar archivos necesarios
        run: |
          FALTAN=""
          if [ ! -f cdp-compartir/plugin.xml ]; then FALTAN="$FALTAN\n  - cdp-compartir/plugin.xml  (sube la carpeta cdp-compartir de D:\\AndroidApk\\reglamento-futbol)"; fi
          if [ ! -f www/assets/logo.png ]; then FALTAN="$FALTAN\n  - www/assets/logo.png  (sube el logo que está en D:\\AndroidApk\\reglamento-futbol\\www\\assets)"; fi
          if [ ! -d res/icon ]; then FALTAN="$FALTAN\n  - res/icon/  (sube la carpeta de iconos de D:\\AndroidApk\\reglamento-futbol\\res\\icon)"; fi
          if [ -n "$FALTAN" ]; then echo "FALTAN ARCHIVOS:$FALTAN"; exit 1; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.0.2'

      - name: Preparar proyecto Cordova
        run: |
          npm install -g cordova@12
          mkdir -p www/assets
          cp index.html www/index.html
          cordova platform add android@12.0.1
          cordova plugin add ./cdp-compartir

      - name: Alinear kotlin-stdlib (evita clases duplicadas)
        run: |
          cat >> platforms/android/app/build.gradle <<'EOF'
          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.10'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.10'
              }
          }
          EOF

      - name: Firma estable (keystore persistente del repo)
        run: |
          mkdir -p ~/.android
          if [ -n "${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}" | base64 -d > ~/.android/debug.keystore
          elif [ -f .github/debug.keystore.b64 ]; then
            base64 -d .github/debug.keystore.b64 > ~/.android/debug.keystore
          else
            echo "⚠️ sin keystore: firma efímera (las actualizaciones darán conflicto de paquete)"
          fi
          if [ -f ~/.android/debug.keystore ]; then cp ~/.android/debug.keystore platforms/android/debug.keystore; echo "firma estable aplicada"; fi

      - name: Compilar APK debug
        run: cordova build android --no-telemetry

      - name: Calcular versión
        run: echo "VER=$(grep -o 'version=\"[^\"]*\"' config.xml | head -1 | cut -d'"' -f2)" >> "$GITHUB_ENV"

      - name: Preparar nombre de la APK
        run: |
          mkdir -p salida
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk "salida/CopaCD-${VER}.apk"

      - name: Subir artefacto (siempre)
        uses: actions/upload-artifact@v4
        with:
          name: CopaCD-${{ env.VER }}-apk
          path: salida/CopaCD-${{ env.VER }}.apk

      - name: Crear Release (solo al empujar un tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Copa CD ${{ env.VER }}
          body: 'El cartel de descarga del login ya no aparece si tu copa esta al dia (la Auto sigue trabajando sola). Header redise~nado y compacto: logo, titulo y los 4 botones caben en una sola fila incluso en telefonos chicos.'
          files: salida/CopaCD-${{ env.VER }}.apk

  keystore:
    runs-on: ubuntu-latest
    outputs:
      generado: ${{ steps.calc.outcome }}
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generar keystore debug estable
        id: calc
        run: |
          keytool -genkeypair -alias androiddebugkey \
            -storepass android -keypass android \
            -dname "CN=Copa CD, OU=CopaCD, O=CopaCD, L=Madrid, C=ES" \
            -keystore debug.keystore -keyalg RSA -keysize 2048 -validity 10950 \
            -storetype PKCS12
          base64 -w0 debug.keystore > debug.keystore.b64
      - uses: actions/upload-artifact@v4
        with:
          name: keystore-estable
          path: debug.keystore.b64
