name: Generar keystore de firma

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Generar keystore debug estable
        run: |
          keytool -genkeypair -alias androiddebugkey \
            -storepass android -keypass android \
            -dname "CN=Copa CD, OU=CopaCD, O=CopaCD, L=Madrid, C=ES" \
            -keystore debug.keystore -keyalg RSA -keysize 2048 -validity 10950
          base64 -w0 debug.keystore > debug.keystore.b64
          ls -la debug.keystore*

      - uses: actions/upload-artifact@v4
        with:
          name: keystore-estable
          path: debug.keystore.b64

      - name: Aviso
        run: echo "Descarga el artefacto y guárdalo como secret ANDROID_DEBUG_KEYSTORE_B64 (el valor del archivo .b64). Contraseña del keystore: android, alias: androiddebugkey."
